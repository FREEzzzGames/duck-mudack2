<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>DUCK MUDACK — ENDLESS</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;width:100%;min-height:100%;background:#02030b;color:#fff;font-family:monospace;}
body{padding:6px;display:flex;justify-content:center;align-items:center;background:radial-gradient(circle at 50% 0,#29105f 0%,#070922 35%,#010208 85%);}
.arcade{width:min(1200px,100%);overflow:hidden;border:3px solid #151a32;border-radius:18px;background:#070a15;box-shadow:0 0 0 2px #292e4c,0 0 50px #153cff55;display:flex;flex-direction:column;}
.marquee{position:relative;padding:12px 10px;text-align:center;background:radial-gradient(circle at 20% 50%,#692cff55,transparent 20%),radial-gradient(circle at 80% 40%,#00cfff55,transparent 20%),#070925;border-bottom:4px solid #121936;}
.marquee h1{margin:0;font-size:clamp(28px,5vw,52px);line-height:.9;letter-spacing:-3px;color:#ffd52c;text-shadow:3px 3px #e52225,6px 6px #15175d,0 0 20px #ffcc27;}
.marquee h1 span{color:#ffef58;}
.sub{margin-top:5px;color:#20eaff;font-size:clamp(11px,2vw,18px);font-weight:bold;text-shadow:0 0 10px #00eaff;}
.duck{position:absolute;top:20px;font-size:28px;}
.duck.left{left:20px;}
.duck.right{right:20px;transform:scaleX(-1);}
.main-container{display:flex;gap:10px;padding:10px;background:#05070e;}
.sidebar{width:180px;flex-shrink:0;display:flex;flex-direction:column;gap:10px;padding:10px;border:2px solid #1634a4;border-radius:12px;background:#070b1bd9;box-shadow:inset 0 0 15px #00d9ff22;}
.start{width:100%;height:65px;border:3px solid #7b1717;border-radius:6px;background:linear-gradient(#ff6b55,#d91414 55%,#8c0505);color:#fff;font:900 13px monospace;cursor:pointer;box-shadow:0 0 0 2px #14152a,0 0 15px #ff222244;}
.start:active{transform:translateY(2px);}
.tip{margin-top:auto;text-align:center;color:#7399c9;font-size:8px;line-height:1.3;}
.screen-wrapper{flex-grow:1;position:relative;border:3px solid #141a32;border-radius:12px;background:#050820;overflow:hidden;}
.game{position:relative;width:100%;height:min(62vh,580px);min-height:380px;overflow:hidden;border:3px solid #0bd7ff;border-radius:6px;background:#050820;touch-action:none;cursor:none;}
canvas{position:absolute;inset:0;width:100%;height:100%;}
#fx,#beam{pointer-events:none;}
.hud{position:absolute;z-index:10;top:8px;left:8px;right:8px;display:flex;justify-content:center;gap:15px;pointer-events:none;}
.hudbox{padding:6px 16px;border:2px solid #20e8ff;border-radius:5px;text-align:center;background:#020922dd;box-shadow:0 0 10px #00d9ff44;}
.hudbox small{display:block;color:#20e8ff;font-size:9px;}
.hudbox b{display:block;margin-top:2px;font-size:18px;}
.energy{position:absolute;z-index:10;bottom:8px;left:8px;padding:4px 8px;border:2px solid #20dfff;border-radius:5px;background:#020922dd;color:#35efff;font-size:12px;font-weight:bold;text-shadow:0 0 8px #35efff;}
.energy strong{font-size:16px;}
.combo{position:absolute;z-index:10;right:8px;bottom:8px;padding:5px 8px;border:2px solid #ffd42a;border-radius:5px;background:#09091ddd;color:#ffd42a;font-size:14px;font-weight:bold;opacity:0;transition:.12s;}
#crosshair{position:absolute;z-index:20;width:46px;height:46px;margin:-23px 0 0 -23px;border:2px solid #ff5b43;border-radius:50%;pointer-events:none;box-shadow:0 0 10px #ff392f;}
#crosshair:before{content:"";position:absolute;width:60px;height:2px;left:-7px;top:20px;background:#ff604c;}
#crosshair:after{content:"";position:absolute;width:2px;height:60px;left:20px;top:-7px;background:#ff604c;}
.dot{position:absolute;width:5px;height:5px;left:18px;top:18px;border-radius:50%;background:#fff;box-shadow:0 0 6px #fff;}
#scanner{position:absolute;z-index:15;width:90px;height:120px;left:50%;bottom:-10px;transform:translateX(-50%) rotate(0deg);transform-origin:50% 90%;pointer-events:none;filter:drop-shadow(0 0 10px #00eaff);transition:left .1s ease-out,transform .1s ease-out;}
.scanner-body{position:absolute;left:22px;bottom:0;width:46px;height:95px;background:linear-gradient(90deg,#132743,#d4f7ff 45%,#254b78);clip-path:polygon(25% 0,75% 0,100% 100%,0 100%);border:3px solid #071a35;}
.scanner-core{position:absolute;left:33px;bottom:12px;width:20px;height:55px;border-radius:6px;background:#43f5ff;box-shadow:0 0 15px #43f5ff,0 0 30px #287cff;}
.scanner-glow{position:absolute;left:32px;bottom:80px;width:22px;height:60px;border-radius:50%;background:linear-gradient(#fff,#42f7ff 35%,transparent);filter:blur(4px);opacity:.12;}
#scanner.active{animation:scan .15s ease-out;}
#scanner.active .scanner-glow{opacity:1;}
@keyframes scan{
  0%{transform:translateX(-50%) rotate(var(--angle,0deg)) scale(1);}
  50%{transform:translateX(-50%) rotate(var(--angle,0deg)) scale(.92);}
  100%{transform:translateX(-50%) rotate(var(--angle,0deg)) scale(1);}
}
.overlay{position:absolute;z-index:30;inset:0;display:flex;align-items:center;justify-content:center;background:#02030bd9;}
.overlay.hidden{display:none;}
.card{width:min(420px,90%);padding:20px;border:3px solid #20e8ff;border-radius:12px;background:#060a1bef;text-align:center;box-shadow:0 0 30px #00d9ff55;}
.card h2{margin:0 0 10px;color:#ffd42a;font-size:26px;text-shadow:2px 2px #f22;}
.card p{color:#b8eaff;font-size:13px;line-height:1.4;}
.bottom{padding:8px;text-align:center;border-top:3px solid #111a3b;color:#ffd42a;font-size:16px;background:#07091d;}
.bottom span{margin-right:6px;color:#c6dcff;font-size:10px;}
.popup{position:absolute;z-index:50;color:#ffe84b;font-size:18px;font-weight:bold;pointer-events:none;text-shadow:2px 2px #e52323,0 0 10px #ffbd19;animation:popup .6s forwards;}
@keyframes popup{
  from{opacity:0;transform:translate(-50%,0) scale(.7);}
  25%{opacity:1;}
  to{opacity:0;transform:translate(-50%,-60px) scale(1.1);}
}
@media(max-width:768px){
  .main-container{flex-direction:column;}
  .sidebar{width:100%;flex-direction:row;align-items:center;}
  .start{width:140px;height:40px;}
  .tip{display:none;}
  .game{height:55vh;}
}
</style>
</head>
<body>
<div class="arcade">
  <header class="marquee">
    <div class="duck left">🦆</div>
    <div class="duck right">🦆</div>
    <h1>DUCK <span>✦</span> MUDACK</h1>
    <div class="sub">ENDLESS SPACE OUTPOST</div>
  </header>
  <div class="main-container">
    <aside class="sidebar">
      <button class="start" id="start">START<br>▶ / ❚❚</button>
      <div class="tip">INFINITE AMMO<br>ENDLESS TARGETS</div>
    </aside>
    <div class="screen-wrapper">
      <div class="game" id="game">
        <canvas id="scene"></canvas>
        <canvas id="beam"></canvas>
        <canvas id="fx"></canvas>
        <div class="hud">
          <div class="hudbox"><small>SCORE</small><b id="score">000000</b></div>
        </div>
        <div class="energy">AMMO <strong>∞</strong></div>
        <div class="combo" id="combo">COMBO x2</div>
        <div id="crosshair"><div class="dot"></div></div>
        <div id="scanner">
          <div class="scanner-glow"></div>
          <div class="scanner-body"></div>
          <div class="scanner-core"></div>
        </div>
        <div class="overlay" id="overlay">
          <div class="card">
            <h2 id="title">DUCK MUDACK</h2>
            <p id="message">Бесконечный режим.<br><br>Нажми START для начала игры.</p>
          </div>
        </div>
      </div>
    </div>
  </div>
  <footer class="bottom">
    <span>🏆 HIGH SCORE</span>
    <b id="highScore">000000</b>
  </footer>
</div>

<script>
"use strict";
const $ = id => document.getElementById(id);
const game = $("game"), scene = $("scene"), beamCanvas = $("beam"), fx = $("fx");
const ctx = scene.getContext("2d"), bctx = beamCanvas.getContext("2d"), fctx = fx.getContext("2d");
const scoreEl = $("score"), highEl = $("highScore"), comboEl = $("combo");
const overlay = $("overlay"), titleEl = $("title"), messageEl = $("message");
const scanner = $("scanner"), crosshair = $("crosshair");

let width = 900, height = 550, running = false, paused = false;
let score = 0, combo = 0, comboTime = 0, ducks = [], particles = [], stars = [], lastTime = 0, gameTime = 0, beam = null;

let highScore = Number(localStorage.getItem("duckMudackHighScore") || 0);
highEl.textContent = String(highScore).padStart(6, "0");

function resize() {
  const rect = game.getBoundingClientRect();
  width = rect.width || 900; height = rect.height || 550;
  const ratio = Math.min(window.devicePixelRatio || 1, 2);
  [scene, beamCanvas, fx].forEach(c => {
    c.width = Math.floor(width * ratio); c.height = Math.floor(height * ratio);
    c.style.width = width + "px"; c.style.height = height + "px";
  });
  ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
  bctx.setTransform(ratio, 0, 0, ratio, 0, 0);
  fctx.setTransform(ratio, 0, 0, ratio, 0, 0);
}
window.addEventListener("resize", resize);
resize();

for (let i = 0; i < 100; i++) {
  stars.push({ x: Math.random(), y: Math.random(), size: Math.random() * 1.8 + .3, speed: Math.random() * .1 + .02, alpha: Math.random() * .8 + .2 });
}

function background(dt) {
  const t = performance.now() / 1000;
  const grad = ctx.createLinearGradient(0, 0, 0, height);
  grad.addColorStop(0, "#020725"); grad.addColorStop(.45, "#24105b"); grad.addColorStop(1, "#06182d");
  ctx.fillStyle = grad; ctx.fillRect(0, 0, width, height);

  const neb = ctx.createRadialGradient(width * .5, height * .3, 0, width * .5, height * .3, width * .6);
  neb.addColorStop(0, "rgba(80,60,255,.22)"); neb.addColorStop(.5, "rgba(180,30,255,.08)"); neb.addColorStop(1, "rgba(0,0,0,0)");
  ctx.fillStyle = neb; ctx.fillRect(0, 0, width, height);

  for (const s of stars) {
    s.y += s.speed * dt; if (s.y > 1) { s.y = 0; s.x = Math.random(); }
    ctx.globalAlpha = s.alpha * (.7 + Math.sin(t * 2 + s.x * 10) * .3);
    ctx.fillStyle = "#eaffff"; ctx.beginPath(); ctx.arc(s.x * width, s.y * height * .75, s.size, 0, Math.PI * 2); ctx.fill();
  }
  ctx.globalAlpha = 1;

  ctx.save(); ctx.shadowBlur = 25; ctx.shadowColor = "#714cff"; ctx.fillStyle = "#3826a5";
  ctx.beginPath(); ctx.arc(width * .15, height * .25, height * .15, 0, Math.PI * 2); ctx.fill(); ctx.restore();

  ctx.fillStyle = "#082e52"; ctx.fillRect(0, height * .72, width, height * .28);
}

function spawn() {
  const fromLeft = Math.random() < .5, size = 24 + Math.random() * 12;
  const speed = 140 * (0.8 + Math.random() * .5) * (1 + gameTime / 60 * .2);
  ducks.push({
    x: fromLeft ? -60 : width + 60, y: height * .18 + Math.random() * height * .4,
    vx: (fromLeft ? 1 : -1) * speed, vy: (Math.random() - .5) * 35, size, flap: Math.random() * 10
  });
}

function drawDuck(d) {
  const s = d.size; ctx.save(); ctx.translate(d.x, d.y);
  if (d.vx < 0) ctx.scale(-1, 1);
  d.flap += .18; const wing = Math.sin(d.flap) * s * .14;

  ctx.fillStyle = "#f0f0e5"; ctx.beginPath(); ctx.ellipse(0, 0, s * .70, s * .34, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = "#2467bd"; ctx.beginPath(); ctx.ellipse(-s * .18, wing * .2, s * .45, s * .18, -.25, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = "#20b85c"; ctx.beginPath(); ctx.arc(s * .43, -s * .22, s * .28, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = "#ffb126"; ctx.beginPath(); ctx.moveTo(s * .62, -s * .22); ctx.lineTo(s * .93, -s * .12); ctx.lineTo(s * .62, -s * .03); ctx.closePath(); ctx.fill();
  ctx.fillStyle = "#111"; ctx.beginPath(); ctx.arc(s * .50, -s * .29, s * .045, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
}

function startGame() {
  score = 0; combo = 0; comboTime = 0; gameTime = 0;
  ducks = []; particles = []; running = true; paused = false;
  overlay.classList.add("hidden");
  for (let i = 0; i < 5; i++) spawn();
  updateHUD();
}

function updateHUD() {
  scoreEl.textContent = String(score).padStart(6, "0");
}

function aimScanner(x, y) {
  const dx = x - width / 2, dy = y - height;
  const limited = Math.max(-30, Math.min(30, Math.atan2(dx, -dy) * 180 / Math.PI));
  scanner.style.left = Math.max(20, Math.min(width - 20, x)) + "px";
  scanner.style.setProperty("--angle", limited + "deg");
  crosshair.style.left = x + "px"; crosshair.style.top = y + "px";
}

function scannerEffect(x, y) {
  beam = { x, y, life: .16 };
  scanner.classList.remove("active"); void scanner.offsetWidth; scanner.classList.add("active");
  for (let i = 0; i < 20; i++) particles.push({ x, y, vx: (Math.random() - .5) * 220, vy: (Math.random() - .5) * 220, life: 1 });
}

function drawBeam(dt) {
  bctx.clearRect(0, 0, width, height);
  if (!beam || (beam.life -= dt) <= 0) { beam = null; return; }
  const grad = bctx.createLinearGradient(width / 2, height - 10, beam.x, beam.y);
  grad.addColorStop(0, "#fff"); grad.addColorStop(.2, "#35f7ff"); grad.addColorStop(1, "rgba(43,108,255,0)");
  bctx.save(); bctx.globalAlpha = Math.min(1, beam.life * 8); bctx.strokeStyle = grad; bctx.lineWidth = 6;
  bctx.shadowBlur = 15; bctx.shadowColor = "#35eaff";
  bctx.beginPath(); bctx.moveTo(width / 2, height - 10); bctx.lineTo(beam.x, beam.y); bctx.stroke(); bctx.restore();
}

function popup(x, y, val) {
  const el = document.createElement("div"); el.className = "popup"; el.textContent = val;
  el.style.left = x + "px"; el.style.top = y + "px"; game.appendChild(el);
  setTimeout(() => el.remove(), 600);
}

function scan(x, y) {
  if (!running || paused) return;
  aimScanner(x, y);
  let hit = -1;
  for (let i = ducks.length - 1; i >= 0; i--) {
    if (Math.hypot(x - ducks[i].x, y - ducks[i].y) < ducks[i].size * .85) { hit = i; break; }
  }
  if (hit >= 0) {
    const d = ducks[hit]; scannerEffect(d.x, d.y); ducks.splice(hit, 1);
    combo++; comboTime = 1.8;
    score += 100 * Math.min(combo, 5);
    popup(d.x, d.y, "+" + (100 * Math.min(combo, 5)));
    comboEl.textContent = "COMBO x" + combo; comboEl.style.opacity = 1;
    spawn(); // Спавним новую утку взамен сбитой
  } else {
    scannerEffect(x, y); combo = 0; comboEl.style.opacity = 0;
  }
  updateHUD();
}

function checkHighScore() {
  if (score > highScore) {
    highScore = score;
    localStorage.setItem("duckMudackHighScore", String(highScore));
    highEl.textContent = String(highScore).padStart(6, "0");
  }
}

$("start").addEventListener("click", () => {
  if (!running) { startGame(); return; }
  paused = !paused;
  overlay.classList.toggle("hidden", !paused);
  if (paused) {
    titleEl.textContent = "PAUSED";
    messageEl.innerHTML = `Игра приостановлена.<br><br>Нажми START / PAUSE, чтобы продолжить.`;
  }
});

const getPos = e => ({ x: e.clientX - game.getBoundingClientRect().left, y: e.clientY - game.getBoundingClientRect().top });
game.addEventListener("pointermove", e => { const p = getPos(e); aimScanner(p.x, p.y); });
game.addEventListener("pointerdown", e => { e.preventDefault(); const p = getPos(e); scan(p.x, p.y); });

function loop(timestamp) {
  if (!lastTime) lastTime = timestamp;
  let dt = Math.min((timestamp - lastTime) / 1000, .033);
  lastTime = timestamp;
  background(dt);

  if (running && !paused) {
    gameTime += dt;
    for (const d of ducks) {
      d.x += d.vx * dt; d.y += d.vy * dt; d.flap += dt * 8;
      if (d.y < height * .12 || d.y > height * .68) d.vy *= -1;
    }
    ducks = ducks.filter(d => d.x > -120 && d.x < width + 120);

    while (ducks.length < Math.min(10, 5 + Math.floor(gameTime / 20))) spawn();

    if ((comboTime -= dt) <= 0) { combo = 0; comboEl.style.opacity = 0; }
    
    checkHighScore();
  }

  ducks.forEach(drawDuck);

  fctx.clearRect(0, 0, width, height);
  particles.forEach(p => {
    p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 70 * dt; p.life -= 3 * dt;
    fctx.globalAlpha = Math.max(0, p.life); fctx.fillStyle = p.life > .5 ? "#35eaff" : "#ffd42a";
    fctx.fillRect(p.x, p.y, 3, 3);
  });
  fctx.globalAlpha = 1;
  particles = particles.filter(p => p.life > 0);

  drawBeam(dt);
  requestAnimationFrame(loop);
}

updateHUD();
requestAnimationFrame(loop);
</script>
</body>
</html>
