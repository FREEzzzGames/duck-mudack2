<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>DUCK MUDACK — SPACE OUTPOST</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  width:100%;
  min-height:100%;
  background:#02030b;
  color:white;
  font-family:monospace;
}

body{
  padding:6px;
  display:flex;
  justify-content:center;
  background:
    radial-gradient(circle at 50% 0,#29105f 0%,#070922 35%,#010208 85%);
}

.arcade{
  width:min(1100px,100%);
  overflow:hidden;
  border:3px solid #151a32;
  border-radius:18px;
  background:#070a15;
  box-shadow:
    0 0 0 2px #292e4c,
    0 0 45px #153cff55;
}

/* HEADER */

.marquee{
  position:relative;
  padding:15px 10px 12px;
  text-align:center;
  background:
    radial-gradient(circle at 20% 50%,#692cff55,transparent 20%),
    radial-gradient(circle at 80% 40%,#00cfff55,transparent 20%),
    #070925;
  border-bottom:5px solid #121936;
}

.marquee h1{
  margin:0;
  font-size:clamp(34px,7vw,68px);
  line-height:.9;
  letter-spacing:-4px;
  color:#ffd52c;
  text-shadow:
    4px 4px #e52225,
    8px 8px #15175d,
    0 0 20px #ffcc27;
}

.marquee h1 span{
  color:#ffef58;
}

.sub{
  margin-top:7px;
  color:#20eaff;
  font-size:clamp(13px,2.5vw,23px);
  font-weight:bold;
  text-shadow:0 0 12px #00eaff;
}

.duck{
  position:absolute;
  top:25px;
  font-size:34px;
}

.duck.left{
  left:20px;
}

.duck.right{
  right:20px;
  transform:scaleX(-1);
}

/* GAME */

.screen{
  margin:10px 15px 0;
  padding:7px;
  border:4px solid #141a32;
  border-radius:14px;
  background:#05070e;
}

.game{
  position:relative;
  width:100%;
  height:min(70vh,700px);
  min-height:420px;
  overflow:hidden;
  border:4px solid #0bd7ff;
  border-radius:7px;
  background:#050820;
  touch-action:none;
  cursor:none;
}

canvas{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
}

#fx,
#beam{
  pointer-events:none;
}

/* HUD */

.hud{
  position:absolute;
  z-index:10;
  top:8px;
  left:8px;
  right:8px;

  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:6px;

  pointer-events:none;
}

.hudbox{
  padding:5px;
  border:2px solid #20e8ff;
  border-radius:5px;
  text-align:center;
  background:#020922dd;
  box-shadow:0 0 10px #00d9ff44;
}

.hudbox small{
  display:block;
  color:#20e8ff;
  font-size:9px;
}

.hudbox b{
  display:block;
  margin-top:2px;
  font-size:18px;
}

/* ENERGY */

.energy{
  position:absolute;
  z-index:10;
  bottom:9px;
  left:9px;

  padding:5px 9px;

  border:2px solid #20dfff;
  border-radius:5px;

  background:#020922dd;
  color:#35efff;

  font-size:14px;
  font-weight:bold;

  text-shadow:0 0 10px #35efff;
}

.energy strong{
  font-size:20px;
}

/* COMBO */

.combo{
  position:absolute;
  z-index:10;
  right:9px;
  bottom:9px;

  padding:6px 10px;

  border:2px solid #ffd42a;
  border-radius:5px;

  background:#09091ddd;
  color:#ffd42a;

  font-size:16px;
  font-weight:bold;

  opacity:0;
  transition:.12s;
}

/* CROSSHAIR */

#crosshair{
  position:absolute;
  z-index:20;

  width:52px;
  height:52px;

  margin:-26px 0 0 -26px;

  border:2px solid #ff5b43;
  border-radius:50%;

  pointer-events:none;

  box-shadow:0 0 12px #ff392f;
}

#crosshair:before{
  content:"";
  position:absolute;
  width:68px;
  height:2px;
  left:-10px;
  top:23px;
  background:#ff604c;
}

#crosshair:after{
  content:"";
  position:absolute;
  width:2px;
  height:68px;
  left:23px;
  top:-10px;
  background:#ff604c;
}

.dot{
  position:absolute;
  width:6px;
  height:6px;
  left:21px;
  top:21px;
  border-radius:50%;
  background:white;
  box-shadow:0 0 8px white;
}

/* SCANNER */

#scanner{
  position:absolute;
  z-index:15;

  width:100px;
  height:135px;

  left:50%;
  bottom:-10px;

  transform:
    translateX(-50%)
    rotate(0deg);

  transform-origin:50% 90%;

  pointer-events:none;

  filter:drop-shadow(0 0 12px #00eaff);

  transition:
    left .12s ease-out,
    transform .12s ease-out;
}

.scanner-body{
  position:absolute;

  left:25px;
  bottom:0;

  width:50px;
  height:105px;

  background:
    linear-gradient(
      90deg,
      #132743,
      #d4f7ff 45%,
      #254b78
    );

  clip-path:
    polygon(
      25% 0,
      75% 0,
      100% 100%,
      0 100%
    );

  border:3px solid #071a35;
}

.scanner-core{
  position:absolute;

  left:38px;
  bottom:15px;

  width:24px;
  height:65px;

  border-radius:8px;

  background:#43f5ff;

  box-shadow:
    0 0 18px #43f5ff,
    0 0 35px #287cff;
}

.scanner-glow{
  position:absolute;

  left:37px;
  bottom:90px;

  width:26px;
  height:70px;

  border-radius:50%;

  background:
    linear-gradient(
      #fff,
      #42f7ff 35%,
      transparent
    );

  filter:blur(5px);

  opacity:.12;
}

#scanner.active{
  animation:scan .18s ease-out;
}

#scanner.active .scanner-glow{
  opacity:1;
}

@keyframes scan{
  0%{
    transform:
      translateX(-50%)
      rotate(var(--angle,0deg))
      scale(1);
  }

  45%{
    transform:
      translateX(-50%)
      rotate(var(--angle,0deg))
      scale(.92);
  }

  100%{
    transform:
      translateX(-50%)
      rotate(var(--angle,0deg))
      scale(1);
  }
}

/* OVERLAY */

.overlay{
  position:absolute;
  z-index:30;
  inset:0;

  display:flex;
  align-items:center;
  justify-content:center;

  background:#02030bd9;
}

.overlay.hidden{
  display:none;
}

.card{
  width:min(500px,90%);
  padding:25px;

  border:3px solid #20e8ff;
  border-radius:12px;

  background:#060a1bef;

  text-align:center;

  box-shadow:0 0 35px #00d9ff55;
}

.card h2{
  margin:0 0 12px;

  color:#ffd42a;

  font-size:30px;

  text-shadow:3px 3px #f22;
}

.card p{
  color:#b8eaff;
  line-height:1.5;
}

/* CONTROLS */

.controls{
  display:grid;
  grid-template-columns:1fr .8fr 1fr;
  gap:9px;

  padding:9px 15px;
}

.panel{
  padding:9px;

  border:2px solid #1634a4;
  border-radius:7px;

  background:#070b1bd9;
}

.panel h3{
  margin:0 0 7px;
  text-align:center;
  color:#20e8ff;
  font-size:13px;
}

.difficulty{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:5px;
}

.diff{
  min-height:52px;

  border:2px solid #1b5b94;
  border-radius:4px;

  background:#06112b;
  color:#b7d9ff;

  font:700 12px monospace;

  cursor:pointer;
}

.diff.active{
  border-color:#ffd42a;
  color:white;
  box-shadow:0 0 12px #ffd42a55;
}

.diff em{
  display:block;
  margin-top:4px;
  color:#83a4c9;
  font-size:8px;
  font-style:normal;
}

.start{
  width:100%;
  height:67px;

  border:3px solid #7b1717;
  border-radius:5px;

  background:
    linear-gradient(
      #ff6b55,
      #d91414 55%,
      #8c0505
    );

  color:white;

  font:900 17px monospace;

  cursor:pointer;

  box-shadow:
    0 0 0 3px #14152a,
    0 0 20px #ff222244;
}

.start:active{
  transform:translateY(2px);
}

.tip{
  margin-top:5px;
  text-align:center;
  color:#7399c9;
  font-size:9px;
}

.art{
  display:flex;
  align-items:center;
  justify-content:center;
  min-height:67px;

  color:#ff8b21;
  font-weight:bold;
  text-align:center;
}

/* HIGH SCORE */

.bottom{
  padding:9px;
  text-align:center;

  border-top:3px solid #111a3b;

  color:#ffd42a;
  font-size:20px;
}

.bottom span{
  margin-right:7px;
  color:#c6dcff;
  font-size:11px;
}

/* POPUP */

.popup{
  position:absolute;
  z-index:50;

  color:#ffe84b;

  font-size:21px;
  font-weight:bold;

  pointer-events:none;

  text-shadow:
    2px 2px #e52323,
    0 0 12px #ffbd19;

  animation:popup .7s forwards;
}

@keyframes popup{
  from{
    opacity:0;
    transform:translate(-50%,0) scale(.7);
  }

  20%{
    opacity:1;
  }

  to{
    opacity:0;
    transform:translate(-50%,-70px) scale(1.2);
  }
}

/* MOBILE */

@media(max-width:760px){

  body{
    padding:2px;
  }

  .arcade{
    border-radius:9px;
  }

  .duck{
    display:none;
  }

  .screen{
    margin:6px;
    padding:4px;
  }

  .game{
    min-height:390px;
    height:70vh;
  }

  .hudbox{
    padding:3px;
  }

  .hudbox small{
    font-size:7px;
  }

  .hudbox b{
    font-size:13px;
  }

  .controls{
    grid-template-columns:1fr;
    padding:6px;
  }

  .bottom{
    font-size:17px;
  }
}
</style>
</head>

<body>

<div class="arcade">

  <header class="marquee">

    <div class="duck left">🦆</div>
    <div class="duck right">🦆</div>

    <h1>
      DUCK <span>✦</span> MUDACK
    </h1>

    <div class="sub">
      SPACE OUTPOST
    </div>

  </header>


  <section class="screen">

    <div class="game" id="game">

      <canvas id="scene"></canvas>
      <canvas id="beam"></canvas>
      <canvas id="fx"></canvas>


      <div class="hud">

        <div class="hudbox">
          <small>SCORE</small>
          <b id="score">000000</b>
        </div>

        <div class="hudbox">
          <small>TIME</small>
          <b id="time">45</b>
        </div>

        <div class="hudbox">
          <small>ROUND</small>
          <b id="round">01/03</b>
        </div>

        <div class="hudbox">
          <small>DUCKS</small>
          <b id="ducks">00</b>
        </div>

      </div>


      <div class="energy">
        ENERGY <strong>∞</strong>
      </div>


      <div class="combo" id="combo">
        COMBO x2
      </div>


      <div id="crosshair">
        <div class="dot"></div>
      </div>


      <div id="scanner">

        <div class="scanner-glow"></div>
        <div class="scanner-body"></div>
        <div class="scanner-core"></div>

      </div>


      <div class="overlay" id="overlay">

        <div class="card">

          <h2 id="title">
            DUCK MUDACK
          </h2>

          <p id="message">
            Выбери сложность и нажми START.<br><br>
            Наводи сканер и нажимай на уток.
          </p>

        </div>

      </div>

    </div>

  </section>


  <section class="controls">


    <div class="panel">

      <h3>✦ DIFFICULTY ✦</h3>

      <div class="difficulty">

        <button
          class="diff"
          data-level="easy"
        >
          EASY
          <em>6 DUCKS</em>
        </button>

        <button
          class="diff active"
          data-level="normal"
        >
          NORMAL
          <em>12 DUCKS</em>
        </button>

        <button
          class="diff"
          data-level="expert"
        >
          EXPERT
          <em>ENDLESS</em>
        </button>

      </div>

    </div>


    <div class="panel">

      <button
        class="start"
        id="start"
      >
        START<br>
        ▶ / ❚❚<br>
        PAUSE
      </button>

      <div class="tip">
        TAP DUCK = SCAN
      </div>

    </div>


    <div class="panel art">
      🦆 SCAN THE DUCKS! ✦
    </div>

  </section>


  <footer class="bottom">

    <span>🏆 HIGH SCORE</span>

    <b id="highScore">
      000000
    </b>

  </footer>

</div>


<script>
"use strict";

/* =====================================================
   DUCK MUDACK
   SIMPLE STABLE VERSION
===================================================== */

const game =
  document.getElementById("game");

const scene =
  document.getElementById("scene");

const beamCanvas =
  document.getElementById("beam");

const fx =
  document.getElementById("fx");

const ctx =
  scene.getContext("2d");

const bctx =
  beamCanvas.getContext("2d");

const fctx =
  fx.getContext("2d");


const scoreEl =
  document.getElementById("score");

const timeEl =
  document.getElementById("time");

const roundEl =
  document.getElementById("round");

const ducksEl =
  document.getElementById("ducks");

const highEl =
  document.getElementById("highScore");

const comboEl =
  document.getElementById("combo");

const overlay =
  document.getElementById("overlay");

const titleEl =
  document.getElementById("title");

const messageEl =
  document.getElementById("message");

const scanner =
  document.getElementById("scanner");

const crosshair =
  document.getElementById("crosshair");


/* =====================================================
   GAME SETTINGS
===================================================== */

const settings = {

  easy:{
    count:6,
    speed:80,
    time:45
  },

  normal:{
    count:12,
    speed:120,
    time:45
  },

  expert:{
    count:4,
    speed:150,
    time:Infinity
  }

};


let difficulty = "normal";

let width = 1000;
let height = 600;

let running = false;
let paused = false;

let score = 0;
let round = 1;
let timeLeft = 45;

let combo = 0;
let comboTime = 0;

let ducks = [];
let particles = [];
let stars = [];

let lastTime = 0;
let gameTime = 0;

let highScore =
  Number(
    localStorage.getItem(
      "duckMudackHighScore"
    ) || 0
  );


highEl.textContent =
  String(highScore).padStart(6,"0");


/* =====================================================
   RESIZE
===================================================== */

function resize(){

  const rect =
    game.getBoundingClientRect();

  width = rect.width;
  height = rect.height;

  const ratio =
    Math.min(
      window.devicePixelRatio || 1,
      2
    );

  [scene,beamCanvas,fx].forEach(canvas=>{

    canvas.width =
      Math.floor(width * ratio);

    canvas.height =
      Math.floor(height * ratio);

    canvas.style.width =
      width + "px";

    canvas.style.height =
      height + "px";

  });

  ctx.setTransform(
    ratio,0,0,ratio,0,0
  );

  bctx.setTransform(
    ratio,0,0,ratio,0,0
  );

  fctx.setTransform(
    ratio,0,0,ratio,0,0
  );

}

window.addEventListener(
  "resize",
  resize
);

resize();


/* =====================================================
   STARS
===================================================== */

for(
  let i=0;
  i<130;
  i++
){

  stars.push({

    x:Math.random(),
    y:Math.random(),

    size:
      Math.random()*2+.4,

    speed:
      Math.random()*.12+.03,

    alpha:
      Math.random()*.8+.2

  });

}


/* =====================================================
   BACKGROUND
===================================================== */

function background(dt){

  const t =
    performance.now()/1000;


  /* SPACE */

  const gradient =
    ctx.createLinearGradient(
      0,0,
      0,height
    );

  gradient.addColorStop(
    0,
    "#020725"
  );

  gradient.addColorStop(
    .45,
    "#24105b"
  );

  gradient.addColorStop(
    1,
    "#06182d"
  );

  ctx.fillStyle =
    gradient;

  ctx.fillRect(
    0,0,
    width,height
  );


  /* NEBULA */

  const nebula =
    ctx.createRadialGradient(
      width*.5,
      height*.3,
      0,
      width*.5,
      height*.3,
      width*.6
    );

  nebula.addColorStop(
    0,
    "rgba(80,60,255,.20)"
  );

  nebula.addColorStop(
    .5,
    "rgba(180,30,255,.08)"
  );

  nebula.addColorStop(
    1,
    "rgba(0,0,0,0)"
  );

  ctx.fillStyle =
    nebula;

  ctx.fillRect(
    0,0,
    width,height
  );


  /* STARS */

  for(const star of stars){

    star.y +=
      star.speed * dt;

    if(star.y > 1){

      star.y = 0;
      star.x = Math.random();

    }

    const x =
      star.x * width;

    const y =
      star.y * height * .75;

    ctx.globalAlpha =
      star.alpha *
      (
        .7 +
        Math.sin(
          t*2+
          star.x*10
        )*.3
      );

    ctx.fillStyle =
      "#eaffff";

    ctx.beginPath();

    ctx.arc(
      x,
      y,
      star.size,
      0,
      Math.PI*2
    );

    ctx.fill();

  }

  ctx.globalAlpha=1;


  /* PURPLE PLANET */

  ctx.save();

  ctx.shadowBlur=30;
  ctx.shadowColor="#714cff";

  ctx.fillStyle="#3826a5";

  ctx.beginPath();

  ctx.arc(
    width*.14,
    height*.27,
    height*.16,
    0,
    Math.PI*2
  );

  ctx.fill();

  ctx.restore();


  /* RED PLANET */

  ctx.save();

  ctx.shadowBlur=20;
  ctx.shadowColor="#ff5038";

  ctx.fillStyle="#ff704b";

  ctx.beginPath();

  ctx.arc(
    width*.72,
    height*.58,
    height*.10,
    0,
    Math.PI*2
  );

  ctx.fill();

  ctx.restore();


  /* WATER */

  ctx.fillStyle =
    "#082e52";

  ctx.fillRect(
    0,
    height*.72,
    width,
    height*.28
  );


  for(
    let i=0;
    i<25;
    i++
  ){

    const y =
      height*.74+
      i*8;

    const x =
      (
        i*97+
        t*25
      )%width;

    ctx.globalAlpha=.22;

    ctx.fillStyle =
      i%2
      ? "#1f75a0"
      : "#32d7d4";

    ctx.fillRect(
      x,
      y,
      40+(i%4)*10,
      2
    );

  }

  ctx.globalAlpha=1;

}


/* =====================================================
   DUCK
===================================================== */

function createDuck(){

  const s =
    settings[difficulty];

  const fromLeft =
    Math.random() < .5;

  const size =
    25+
    Math.random()*13;

  const direction =
    fromLeft ? 1 : -1;

  const speed =
    s.speed *
    (
      0.8+
      Math.random()*.5
    ) *
    (
      1+
      gameTime/45*.3
    );

  return {

    x:
      fromLeft
      ? -60
      : width+60,

    y:
      height*.20+
      Math.random()*
      height*.38,

    vx:
      direction*speed,

    vy:
      (
        Math.random()-.5
      )*35,

    size:size,

    flap:
      Math.random()*10

  };

}


/* =====================================================
   DRAW DUCK
===================================================== */

function drawDuck(duck){

  const s =
    duck.size;

  ctx.save();

  ctx.translate(
    duck.x,
    duck.y
  );

  if(duck.vx<0){

    ctx.scale(
      -1,
      1
    );

  }


  duck.flap +=
    .15;


  const wing =
    Math.sin(
      duck.flap
    ) * s*.13;


  /* BODY */

  ctx.fillStyle =
    "#f0f0e5";

  ctx.beginPath();

  ctx.ellipse(
    0,
    0,
    s*.70,
    s*.34,
    0,
    0,
    Math.PI*2
  );

  ctx.fill();


  /* WING */

  ctx.fillStyle =
    "#2467bd";

  ctx.beginPath();

  ctx.ellipse(
    -s*.18,
    wing*.2,
    s*.45,
    s*.18,
    -.25,
    0,
    Math.PI*2
  );

  ctx.fill();


  /* HEAD */

  ctx.fillStyle =
    "#20b85c";

  ctx.beginPath();

  ctx.arc(
    s*.43,
    -s*.22,
    s*.28,
    0,
    Math.PI*2
  );

  ctx.fill();


  /* BEAK */

  ctx.fillStyle =
    "#ffb126";

  ctx.beginPath();

  ctx.moveTo(
    s*.62,
    -s*.22
  );

  ctx.lineTo(
    s*.93,
    -s*.12
  );

  ctx.lineTo(
    s*.62,
    -s*.03
  );

  ctx.closePath();

  ctx.fill();


  /* EYE */

  ctx.fillStyle =
    "#111";

  ctx.beginPath();

  ctx.arc(
    s*.50,
    -s*.29,
    s*.045,
    0,
    Math.PI*2
  );

  ctx.fill();


  ctx.restore();

}


/* =====================================================
   SPAWN
===================================================== */

function spawn(){

  ducks.push(
    createDuck()
  );

}


/* =====================================================
   START
===================================================== */

function startGame(){

  score=0;
  round=1;

  timeLeft =
    settings[difficulty].time;

  combo=0;
  comboTime=0;

  gameTime=0;

  ducks=[];
  particles=[];

  running=true;
  paused=false;

  overlay.classList.add(
    "hidden"
  );


  const count =
    difficulty==="expert"
    ? 4
    : settings[difficulty].count;


  for(
    let i=0;
    i<count;
    i++
  ){

    spawn();

  }


  updateHUD();

}


/* =====================================================
   HUD
===================================================== */

function updateHUD(){

  scoreEl.textContent =
    String(score)
    .padStart(6,"0");

  timeEl.textContent =
    difficulty==="expert"
    ? "∞"
    :
    String(
      Math.max(
        0,
        Math.ceil(timeLeft)
      )
    ).padStart(
      2,
      "0"
    );

  roundEl.textContent =
    difficulty==="expert"
    ? "∞"
    :
    String(round)
    +"/03";

  ducksEl.textContent =
    difficulty==="expert"
    ? "∞"
    :
    String(
      ducks.length
    ).padStart(
      2,
      "0"
    );

}
